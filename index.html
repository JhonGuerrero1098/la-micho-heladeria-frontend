<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La micho</title>
    <link rel="stylesheet" href="colores.css">
    <link rel="stylesheet" href="style.css">
    <script src="sesion.js"></script>
    <script>
        // GUARDIÁN DE SESIÓN: antes de dibujar nada. Con sesión válida (aunque se recargue con F5)
        // se queda en el panel; sin sesión o vencida, al login (replace evita volver con "Atrás").
        if (!Sesion.obtener()) {
            window.location.replace('login.html');
        }
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Fondo oscuro detrás del menú lateral en celulares/tablets -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>Ferreteria</h1>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active" data-section="Inicio"> Inicio</a></li>
                <li><a href="#" data-section="inventario"> Inventario</a></li>
                <li><a href="#" data-section="clientes"> Clientes</a></li>
                <li><a href="#" data-section="pos"> Punto de venta (POS)</a></li>
                <li><a href="#" data-section="ventas-dia">Ventas del Día</a></li>
                <li><a href="#" data-section="producto-mas-vendido">Top ventas</a></li>
            </ul>
            <!--   Botón de Cerrar Sesión -->
            <div class="sidebar-footer">
                <button type="button" id="btn-cerrar-sesion" class="btn-cerrar-sesion">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-izq">
                    <button type="button" class="btn-menu" id="btn-menu" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
                    <h2 id="section-title">Dashboard</h2>
                </div>
                <div class="user-profile">
                    <span>Admin Ferreteria</span>
                </div>
            </header>
            <section class="content-body">
                <div class="card">
                    <h3> Bienvenido </h3>
                    <p> Selecciona una opcion del menu para administrar productos, clientes o realizar ventas.</p>
                </div>
            </section>
        </main>
    </div>
    <!-- Script principal de la aplicación -->
    <script src="app.js"></script>
</body>
</html>
