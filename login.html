<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Ferretería</title>
    <link rel="stylesheet" href="colores.css">
    <link rel="stylesheet" href="style.css">
    <script src="sesion.js"></script>
    <script>
        // Si ya hay una sesión válida, no se pide login otra vez
        if (Sesion.obtener()) {
            window.location.replace('index.html');
        }
    </script>
</head>
<body class="pagina-login">

    <main class="login-escena">
    <!-- Logo detrás de la tarjeta: se asoma por arriba (y por el lateral en escritorio) -->
    <img class="login-logo" src="./lamichologo.png" alt="Logo de La Micho Heladería" width="400" height="400">

    <div class="login-card">
        <!-- FORMULARIO DE LOGIN -->
        <div id="seccion-login">
            <h2>Iniciar Sesión</h2>
            <p class="login-subtitulo">Heladería La Micho</p>
            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="admin@ferreteria.com">
                </div>
                
                <div class="form-group">
                    <label for="login-contrasena">Contraseña</label>
                    <!-- Contenedor con posición relativa para alinear el botón del vector -->
                    <div class="password-container">
                        <input type="password" id="login-contrasena" required placeholder="********">
                        <button type="button" id="btn-toggle-password" class="btn-toggle-password" title="Mostrar/Ocultar contraseña">
                            <!-- Icono de Ojo Abierto (Neutro/Moderno) -->
                            <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <!-- Icono de Ojo Tachado (Oculto) -->
                            <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-action">Ingresar</button>
                <p id="error-msg" class="msg"></p>
            </form>
        </div>
    </div>
    </main>

    <script>
        // Lógica para alternar la visibilidad de la contraseña y cambiar entre los iconos SVG
        const btnTogglePassword = document.getElementById('btn-toggle-password');
        const inputContrasena = document.getElementById('login-contrasena');
        const iconEye = document.getElementById('icon-eye');
        const iconEyeOff = document.getElementById('icon-eye-off');

        if (btnTogglePassword && inputContrasena) {
            btnTogglePassword.addEventListener('click', () => {
                if (inputContrasena.type === 'password') {
                    inputContrasena.type = 'text';
                    iconEye.style.display = 'none';
                    iconEyeOff.style.display = 'block';
                } else {
                    inputContrasena.type = 'password';
                    iconEye.style.display = 'block';
                    iconEyeOff.style.display = 'none';
                }
            });
        }

        // Lógica de Inicio de Sesión
        const formLogin = document.getElementById('form-login');
        const errorMsg = document.getElementById('error-msg');

        formLogin.addEventListener('submit', (e) => {
            e.preventDefault();
            errorMsg.textContent = '';
            
            const credentials = {
                email: document.getElementById('login-email').value,
                contrasena: inputContrasena.value
            };

            fetch('https://la-micho-heladeria-backend.onrender.com/api/Usuarios/Login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credentials)
            })
            .then(async res => {
                if (res.ok) {
                    const data = await res.json();
                    
                    // Guardar la sesión (con vencimiento) y entrar al panel principal
                    Sesion.iniciar(data.usuario);
                    window.location.replace('index.html');
                } else {
                    const errorText = await res.text();
                    errorMsg.textContent = errorText || 'Correo o contraseña incorrectos.';
                }
            })
            .catch(err => {
                console.error('Error:', err);
                errorMsg.textContent = 'Error de conexión con el servidor.';
            });
        });
    </script>

</body>
</html>
